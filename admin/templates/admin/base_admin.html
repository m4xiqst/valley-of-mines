<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
</head>
<body>
    {% if menu %}
            <ul class="main-menu">
                {% for item in menu %}
                <li class="menu-item"><a href="{{ url_for(item.url) }}">{{ item.title }}</a></li>
                {% endfor %}
            </ul>
        
    {% else %}
        <h2 style="color: red;">Тут должно быть меню, но оно где-то потерялось</h2>
    {% endif %}

    <div class="clear"></div>

    {% block content %}
    {% endblock %}
    
</body>
</html>
