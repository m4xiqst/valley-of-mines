{% extends 'admin/base_admin.html' %}
{% block content %}
    {{ super() }}
    <ul>
        {% for user in users %}
        <li>
            <h2> {{ user.user_login }}</h2>
            <p> {{ user.user_email }}</p>
            <p> {{ user.created_at }}</p>
        </li>
        {% endfor %}
    </ul>
{% endblock %}
