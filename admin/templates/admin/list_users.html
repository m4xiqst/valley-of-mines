{% extends 'admin/base_admin.html' %}
{% block content %}
    {{ super() }}
    <ul>
        {% for user in users %}
        <li>
            <h2> <a href='{{ url_for('admin.show_user', user_id = user.id)}}'>{{ user.user_login }}</a></h2>
            <p> {{ user.user_email }}</p>
            <p> {{ user.created_at }}</p>

            <p> is admin:
            {% if user.is_admin %}
            <span> {{ 'Yes' }} </span>
            {% else %}
            <span> {{ 'No' }} </span>
            {% endif %}
            </p>
        </li>
        {% endfor %}
    </ul>
{% endblock %}
